<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sakuraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5f8"/>
      <stop offset="45%" stop-color="#ffb3c1"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </radialGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#ff758f" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer soft pastel circular background -->
  <circle cx="32" cy="32" r="29" fill="#fff0f3" stroke="#ffccd5" stroke-width="2" filter="url(#softGlow)"/>
  
  <!-- 5 Sakura Petals rotated around center (32, 32) -->
  <g transform="translate(32, 32)">
    <!-- Petal 1 (0 deg) -->
    <path d="M 0 -6 C -6 -13 -11 -21 -4 -25 C -1 -26 0 -22 0 -22 C 0 -22 1 -26 4 -25 C 11 -21 6 -13 0 -6 Z" fill="url(#sakuraGrad)"/>
    <!-- Petal 2 (72 deg) -->
    <g transform="rotate(72)">
      <path d="M 0 -6 C -6 -13 -11 -21 -4 -25 C -1 -26 0 -22 0 -22 C 0 -22 1 -26 4 -25 C 11 -21 6 -13 0 -6 Z" fill="url(#sakuraGrad)"/>
    </g>
    <!-- Petal 3 (144 deg) -->
    <g transform="rotate(144)">
      <path d="M 0 -6 C -6 -13 -11 -21 -4 -25 C -1 -26 0 -22 0 -22 C 0 -22 1 -26 4 -25 C 11 -21 6 -13 0 -6 Z" fill="url(#sakuraGrad)"/>
    </g>
    <!-- Petal 4 (216 deg) -->
    <g transform="rotate(216)">
      <path d="M 0 -6 C -6 -13 -11 -21 -4 -25 C -1 -26 0 -22 0 -22 C 0 -22 1 -26 4 -25 C 11 -21 6 -13 0 -6 Z" fill="url(#sakuraGrad)"/>
    </g>
    <!-- Petal 5 (288 deg) -->
    <g transform="rotate(288)">
      <path d="M 0 -6 C -6 -13 -11 -21 -4 -25 C -1 -26 0 -22 0 -22 C 0 -22 1 -26 4 -25 C 11 -21 6 -13 0 -6 Z" fill="url(#sakuraGrad)"/>
    </g>
    
    <!-- Flower Center Core -->
    <circle cx="0" cy="0" r="5.5" fill="url(#centerGrad)"/>
    <circle cx="-1.5" cy="-1.5" r="1.5" fill="#ffffff" opacity="0.85"/>
    
    <!-- Cute little sparkles -->
    <path d="M 15 -15 Q 15 -11 19 -11 Q 15 -11 15 -7 Q 15 -11 11 -11 Q 15 -11 15 -15 Z" fill="#ffd166"/>
    <circle cx="-16" cy="15" r="1.5" fill="#ff758f"/>
    <circle cx="16" cy="13" r="1.2" fill="#ffccd5"/>
  </g>
</svg>
