<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff758f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff4d6d;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#ffe5ec;stop-opacity:0.85"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#c9184a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Circle Background -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  
  <!-- Inner soft glow -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Sakura Flower (5 petals) -->
  <g transform="translate(100,88)">
    <!-- Petal 1 (top) -->
    <ellipse cx="0" cy="-22" rx="12" ry="20" fill="url(#petalGrad)" transform="rotate(0)" opacity="0.92"/>
    <!-- Petal 2 -->
    <ellipse cx="0" cy="-22" rx="12" ry="20" fill="url(#petalGrad)" transform="rotate(72)" opacity="0.92"/>
    <!-- Petal 3 -->
    <ellipse cx="0" cy="-22" rx="12" ry="20" fill="url(#petalGrad)" transform="rotate(144)" opacity="0.92"/>
    <!-- Petal 4 -->
    <ellipse cx="0" cy="-22" rx="12" ry="20" fill="url(#petalGrad)" transform="rotate(216)" opacity="0.92"/>
    <!-- Petal 5 -->
    <ellipse cx="0" cy="-22" rx="12" ry="20" fill="url(#petalGrad)" transform="rotate(288)" opacity="0.92"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="6" fill="#ffb3c1"/>
    <circle cx="0" cy="0" r="3" fill="#ff758f"/>
  </g>
  
  <!-- Text: SIA -->
  <text x="100" y="138" text-anchor="middle" font-family="'Quicksand','Nunito',sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="3">SIA</text>
  
  <!-- Text: AKN -->
  <text x="100" y="162" text-anchor="middle" font-family="'Quicksand','Nunito',sans-serif" font-size="16" font-weight="700" fill="#ffe5ec" letter-spacing="5">AKN</text>
</svg>
